name: DN

permissions:
  contents: write

on:
  workflow_dispatch:
  # 如果需要自動排程，可以把下面兩行取消註解
  # schedule:
  #   - cron: '0 0,12 * * *'

jobs:
  process_nc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow google-generativeai
          
      - name: Download ECMWF Data
        run: python run_dn.py

      # 【第一階段 Push】：先將下載好的圖片與 index.json 推送到 GitHub
      - name: Commit & Push images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          # 將所有新增的檔案（圖片、json）加入
          git add .
          git commit -m "Auto-update: ECMWF images [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main

      # 圖片上傳完成後，再開始執行 AI 分析
      - name: Run AI Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_agent.py

      # 【第二階段 Push】：將 AI 產生的 .txt 分析報告推送到 GitHub
      - name: Commit & Push AI Output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 這裡只抓取 AI 產生的 txt 檔 (避免重複 add 不必要的檔案)
          git add *.txt || true
          git commit -m "Auto-update: AI Forecast Discussion [skip ci]" || echo "No AI output to commit"
          git pull --rebase origin main
          git push origin main
